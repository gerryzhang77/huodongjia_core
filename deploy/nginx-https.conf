log_format eventclub_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
map $request_uri $eventclub_page_cache {
    default no-cache;
    ~^/nfc/ no-store;
}
server {
    listen 80;
    server_name www.eventclub.cn eventclub.cn;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ { root /var/www/eventclub/acme; }
    location / { return 301 https://www.eventclub.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name eventclub.cn;
    ssl_certificate /etc/letsencrypt/live/www.eventclub.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.eventclub.cn/privkey.pem;
    access_log off;
    error_log /dev/null;
    return 301 https://www.eventclub.cn$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.eventclub.cn;
    ssl_certificate /etc/letsencrypt/live/www.eventclub.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.eventclub.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/eventclub/current;
    access_log /var/log/nginx/eventclub-access.log eventclub_safe;
    error_log /dev/null;
    index index.html;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # NFC paths contain private tokens. Never log their raw path or query.
    location ^~ /api/nfc/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:10203;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ^~ /nfc/ {
        access_log off;
        error_log /dev/null;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
    location = /api { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:10203;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ^~ /assets/ {
        root /var/www/eventclub;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html { add_header Cache-Control $eventclub_page_cache always; }
    location ~ /\. { deny all; }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map|json|webmanifest)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
