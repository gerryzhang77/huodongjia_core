server {
    listen 80;
    server_name www.eventclub.cn eventclub.cn;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ { root /var/www/eventclub/acme; }
    location / {
        default_type text/plain;
        add_header Retry-After 120 always;
        return 503 "Service migration in progress. Please try again shortly.\n";
    }
}
